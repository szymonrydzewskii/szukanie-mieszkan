name: Skan mieszkań

# SPEC pkt 4: cron w Actions bywa nieprecyzyjny/opóźniany — kod zakłada
# nieregularne odstępy i nadrabia zaległości (high-water-mark na created_time).
on:
  schedule:
    # Co ~15 min, ale minuty PRZESUNIĘTE względem :00/:15/:30/:45 — GitHub najczęściej
    # pomija zadania odpalane w równych kwadransach (szczyt obciążenia). SPEC pkt 4:
    # cron bywa opóźniany/pomijany, dlatego kod nadrabia zaległości (high-water-mark).
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:             # ręczne uruchomienie z zakładki Actions (do testów)
    inputs:
      test_alert:
        description: "Wyślij testową wiadomość na #alerty zamiast skanu"
        type: boolean
        default: false
  repository_dispatch:           # niezawodny wyzwalacz zewnętrzny (darmowy cron -> API GitHuba)
    types: [scan]                # co 15 min pewniej niż wbudowany schedule GitHuba

# Prawo zapisu — workflow commituje zaktualizowany state/seen.json z powrotem.
permissions:
  contents: write

# Nie pozwól dwóm przebiegom nadpisywać sobie stanu jednocześnie.
concurrency:
  group: skan-mieszkan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10          # SPEC pkt 7: cały przebieg ma być krótki (~3 min)
    steps:
      - name: Checkout
        uses: actions/checkout@v5     # v5 = Node 24 (v4 używał wycofywanego Node 20)
        with:
          fetch-depth: 0         # pełna historia — potrzebna do git pull --rebase

      - name: Python
        uses: actions/setup-python@v6  # v6 = Node 24
        with:
          python-version: "3.12"

      - name: Zależności
        run: pip install -r requirements.txt

      - name: Skan (python main.py --once)
        env:
          # SPEC pkt 5: sekret WYŁĄCZNIE przez Actions secrets, nigdy w kodzie/stanie.
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_REJECTED: ${{ secrets.DISCORD_WEBHOOK_REJECTED }}
          DISCORD_WEBHOOK_SALE: ${{ secrets.DISCORD_WEBHOOK_SALE }}
          DISCORD_WEBHOOK_SALE_REJECTED: ${{ secrets.DISCORD_WEBHOOK_SALE_REJECTED }}
          DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
        # Przy ręcznym uruchomieniu z zaznaczonym test_alert wysyłamy tylko test na
        # #alerty (nie skanujemy). Cron/repository_dispatch zawsze robią zwykły skan.
        run: |
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            python main.py --test-alert
          else
            python main.py --once
          fi

      - name: Commit zaktualizowanego stanu
        if: always()             # zapisz stan nawet jeśli krok skanu zawiódł po zmianie stanu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          if git diff --cached --quiet; then
            echo "Brak zmian w stanie — nic do commitu."
            exit 0
          fi
          git commit -m "state: aktualizacja seen.json [skip ci]"
          # SPEC pkt 3: git pull --rebase przed pushem; przy porażce spróbuj raz
          # jeszcze, potem zaloguj i zakończ BEZ wywracania runu.
          for attempt in 1 2; do
            echo "Push stanu, próba $attempt..."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
              || git rebase --abort 2>/dev/null || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Push OK."
              exit 0
            fi
            echo "Push nieudany (próba $attempt)."
            sleep 3
          done
          echo "::warning::Nie udało się wypchnąć stanu po 2 próbach — następny przebieg nadrobi."
          exit 0
