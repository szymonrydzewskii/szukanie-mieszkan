# Konfiguracja bota. WSZYSTKIE kwoty/progi/filtry mieszkają tutaj.
# Na Etapie 1 wykorzystywana jest tylko sekcja `http` i `sources.olx`.
# Kolejne sekcje (filtry, budżet, scoring, progi) dojdą na etapach 3-4.

http:
  # Uczciwy User-Agent identyfikujący bota (SPEC: bez podszywania i omijania zabezpieczeń).
  user_agent: "mieszkania-bot/0.1 (personal apartment search)"
  timeout_seconds: 20          # SPEC: portal bez odpowiedzi w 20 s -> pomiń w tym cyklu
  jitter_seconds: [1, 4]       # losowy odstęp przed zapytaniem (kultura pobierania)

notify:
  photo_size: "640x480"        # podstawiane w szablon linku zdjęcia OLX (...s={width}x{height})
  # Gotowa wiadomość do właściciela (SPEC) — placeholdery: {district} {city} {area} {rooms} {floor}
  owner_message_template: >-
    Dzień dobry, jesteśmy zainteresowani wynajmem Państwa mieszkania
    ({district}, {area} m², {rooms} pok.). Czy jest jeszcze dostępne i kiedy
    moglibyśmy je obejrzeć? Wynajmujemy we dwoje, spokojni studenci UG,
    na co najmniej rok akademicki. Pozdrawiamy.

state:
  path: "state/seen.json"      # commitowany stan (Etap 5 zajmie się commitem z Actions)
  max_age_days: 60             # SPEC: wpisy starsze niż 60 dni usuwamy

dedup:
  price_drop_threshold: 100    # zł; spadek CENY o więcej niż tyle = ponowna wysyłka "OBNIŻKA"

budget:
  hard_limit: 3500             # SPEC: koszt całkowity > 3500 zł = odrzut, bez wyjątków
  min_plausible_rent: 50       # czynsz poniżej tej kwoty = śmieciowy placeholder -> szacuj
  estimates:                   # konserwatywne szacunki, gdy oferta nie podaje składników
    czynsz_blok: 550           # czynsz administracyjny (blok i pochodne)
    czynsz_kamienica: 400      # czynsz administracyjny (kamienica)
    media_default: 350         # media przy ogrzewaniu miejskim/gazowym / nieznanym
    media_electric: 700        # media przy ogrzewaniu elektrycznym

filters:                       # filtry twarde — stosowane PRZED ocenianiem
  min_area_m2: 35
  min_rooms: 2
  max_age_days: 7              # ogłoszenie starsze niż tyle dni w chwili wykrycia = odrzut
  allowed_cities: [Gdańsk, Sopot, Gdynia]
  # Lokalizacja jako TWARDY filtr — wysyłamy tylko z tych kategorii dzielnic (patrz
  # sekcja `location.tier_districts`). Daleka "reszta" (tier 'other') odpada.
  location_accept_tiers: [best, very_good, good, ok]
  # Prawie-trafienie po koszcie: koszt w (hard_limit, near_miss_cost_max] -> #odrzucone.
  near_miss_cost_max: 3900
  # kawalerka (mniej pokoi) NIE odpada, jeśli opis sugeruje oddzielną sypialnię
  # -> trafia na #odrzucone jako prawie-trafienie (sprawdź układ):
  studio_bedroom_keywords:
    - sypialni                 # rdzeń: sypialnia/sypialnię/sypialni
  reject_phrases:              # wykluczenie najemcy
    - nie wynajmę studentom
    - nie dla studentów
    - bez studentów
    - tylko dla pracujących
    - tylko pracujący
    - wyłącznie pracujący
    - tylko rodzina
    - tylko dla rodzin
    - tylko dla rodziny
  type_reject_keywords:        # typ inny niż samodzielne mieszkanie
    - współlokator
    - współlokatorka
    - wynajmę pokój
    - pokój w mieszkaniu
    - miejsce w pokoju
    - stancja
    - współdzielenie
    - do współdzielenia
  no_bathroom_keywords:
    - łazienka wspólna
    - wspólna łazienka
    - bez łazienki
  souterrain_keywords:
    - suteren                  # rdzeń: suterena/suterenie/suterenę

heating:                       # ogrzewanie NIE jest polem OLX — wykrywamy z opisu
  electric_keywords:           # -> media 700 (+ -8 pkt w Etapie 4)
    - ogrzewanie elektryczne
    - elektryczne ogrzewanie
    - grzejniki elektryczne
    - piece elektryczne
    - ogrzewanie prądem
    - mata grzewcza
  reject_keywords:             # piecowe/kaflowe/węglowe -> odrzut
    - piec kaflowy
    - piece kaflowe
    - ogrzewanie piecowe
    - ogrzewanie węglowe
    - piec węglowy
    - na węgiel
    - opalane węglem

sources:
  olx:
    enabled: true
    base_url: "https://www.olx.pl/api/v1/offers/"
    category_id: 15            # Mieszkania -> Wynajem (potwierdzone: category.type == real_estate)
    sort_by: "created_at:desc" # najnowsze najpierw (dla nadrabiania zaległości po ostatnim ID)
    limit: 40                  # ile ofert na zapytanie (jedno zapytanie na miasto na cykl)
    # city_id potwierdzone na żywo przez API (wszystkie w region Pomorskie):
    cities:
      gdansk: 5659
      sopot: 15983
      gdynia: 5849

# ---- Lokalizacja: tabela dzielnic (twardy filtr) + stacje SKM (do embeda) ----
location:
  tier_districts:              # dopasowanie po fragmencie nazwy (miasto + dzielnica)
    best: [oliwa, żabianka, przymorze, sopot, jelitkowo]
    very_good: [wrzeszcz, zaspa, strzyża, brzeźno]
    good: [brętowo, niedźwiednik, morena, piecki, migowo]
    ok: [suchanino, aniołki, śródmieście, chełm]
    # wszystko inne => tier 'other' (odrzucane, jeśli nie ma go w filters.location_accept_tiers)
  walk: {straight_factor: 1.3, speed_m_per_min: 83}   # SPEC: linia prosta ×1,3
  # Współrzędne PRZYBLIŻONE — tylko do wyświetlenia szac. czasu dojścia (edytuj wg potrzeby).
  stations:
    - {name: "Sopot Kamienny Potok", lat: 54.4487, lon: 18.5566, on_axis: true}
    - {name: "Sopot Wyścigi", lat: 54.4370, lon: 18.5626, on_axis: true}
    - {name: "Sopot", lat: 54.4419, lon: 18.5601, on_axis: true}
    - {name: "Gdańsk Żabianka-AWFiS", lat: 54.4176, lon: 18.6116, on_axis: true}
    - {name: "Gdańsk Oliwa", lat: 54.4088, lon: 18.5762, on_axis: true}
    - {name: "Gdańsk Przymorze-Uniwersytet", lat: 54.4046, lon: 18.5945, on_axis: true}
    - {name: "Gdańsk Wrzeszcz", lat: 54.3805, lon: 18.6096, on_axis: false}
    - {name: "Gdańsk Zaspa", lat: 54.3970, lon: 18.6265, on_axis: false}
    - {name: "Gdańsk Główny", lat: 54.3558, lon: 18.6440, on_axis: false}
    - {name: "Gdynia Główna", lat: 54.5188, lon: 18.5326, on_axis: false}
